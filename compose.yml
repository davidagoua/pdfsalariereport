services:
  web:
    build: .
    container_name: pdfsalarie_app
    ports:
      - "8000:8000"
    volumes:
      # Map the local assets folder to the container to persist files and logs
      - ./assets:/app/assets
 
    environment:
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_TO=charlessabenin@gmail.com
      - SMTP_USER=performerscommuncation@gmail.com
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:14
    expose:
      - 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: unless-stopped



volumes:
  pgdata:
